  </body>
  <script>
    const sideBranchLine = document.getElementById("sideBranchLine");

    function resizeSideBranchLength() {
      var sideBranchX = window.innerWidth * 0.08;
      var sideBranchY = window.innerHeight * 0.16;
      var sideBranchLength = Math.sqrt(sideBranchX * sideBranchX + sideBranchY * sideBranchY);
      sideBranchLine.style.width = `${sideBranchLength}px`;
      var branchSinusAngle = Math.asin(sideBranchY/sideBranchLength) * (180 / Math.PI);
      sideBranchLine.style.rotate = `${branchSinusAngle}deg`;
      
    }

    window.addEventListener('resize', (event) => {
      resizeSideBranchLength();
    })

    resizeSideBranchLength();
  </script>
